<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Everbloom — send a bouquet that keeps growing</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Outfit:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --bg:#EEF2E8; --bg-deep:#E3E9D9; --ink:#20301F; --ink-soft:#4B5A45; --panel:#FBFAF4;
  --line:rgba(32,48,31,0.12); --plum:#8C5A6B; --plum-deep:#6E4453; --leaf:#4C6B4F;
  --blush:#E7ABAA; --amber:#D6A257; --lavender:#A288BF; --ivory:#F3EBDA; --sage:#7C9473;
  --radius:18px; --shadow:0 18px 50px rgba(32,48,31,0.14); --dur:.5s; --ease:cubic-bezier(.22,.88,.4,1.05);
  --t-bg:#F7EDE9; --t-bg2:#F0DCE0; --t-ink:#3B2A2E; --t-accent:#C97B86; --t-accent2:#E3A6AE;
}
html.reduced-motion{ --dur:.01s; }
html.reduced-motion *{ animation-duration:.01s !important; transition-duration:.01s !important; }
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Outfit',sans-serif;font-weight:300;-webkit-tap-highlight-color:transparent;}
h1,h2,h3{font-family:'Fraunces',serif;font-weight:500;letter-spacing:-0.01em;color:var(--ink);}
.mono{font-family:'IBM Plex Mono',monospace;}
button{font-family:'Outfit',sans-serif;cursor:pointer;border:none;background:none;color:inherit;}
a{color:inherit;}
:focus-visible{outline:2px solid var(--plum);outline-offset:3px;border-radius:6px;}
.view{display:none;} .view.active{display:block;}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;}

.topbar{ position:sticky; top:0; z-index:40; display:flex; align-items:center; justify-content:space-between; padding:16px 22px; background:rgba(238,242,232,0.85); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
.brand{ display:flex; align-items:center; gap:8px; font-family:'Fraunces',serif; font-size:19px; font-weight:600; }
.brand .mark{ width:20px; height:20px; }
.topbar .backLink{ font-size:14px; color:var(--ink-soft); text-decoration:none; display:flex; align-items:center; gap:6px; }

/* ================= HOME ================= */
#view-home .hero{ position:relative; min-height:76vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:60px 22px 40px; overflow:hidden; }
.heroField{ position:absolute; inset:0; pointer-events:none; z-index:0; }
.idleFlower{ position:absolute; animation:idleSway 7s ease-in-out infinite; transform-origin:50% 85%; }
@keyframes idleSway{ 0%,100%{transform:rotate(-5deg) translateY(0);} 50%{transform:rotate(5deg) translateY(-6px);} }
.hero .eyebrow{ position:relative; z-index:1; font-size:11px; letter-spacing:0.3em; text-transform:uppercase; color:var(--plum); display:flex; align-items:center; gap:10px; margin-bottom:18px; }
.hero .eyebrow::before,.hero .eyebrow::after{content:'';width:24px;height:1px;background:var(--plum);opacity:0.55;}
.hero h1{ position:relative; z-index:1; font-size:clamp(34px,7vw,58px); line-height:1.1; max-width:820px; }
.hero h1 em{ font-style:italic; color:var(--plum); }
.hero p{ position:relative; z-index:1; max-width:460px; color:var(--ink-soft); font-size:16px; line-height:1.7; margin:20px 0 32px; }
.ctaRow{ position:relative; z-index:1; display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
.btn{ padding:14px 28px; border-radius:40px; font-size:14.5px; transition:transform .25s var(--ease); }
.btn:active{ transform:scale(0.96); }
.btn-primary{ background:var(--plum); color:var(--panel); box-shadow:0 10px 26px rgba(140,90,107,0.35); }
.btn-ghost{ border:1px solid var(--line); color:var(--ink); }
.btn-sm{ padding:9px 16px; font-size:13px; border-radius:20px; }

.themeStrip{ padding:50px 22px 70px; max-width:960px; margin:0 auto; text-align:center; }
.themeCards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:14px; max-width:760px; margin:30px auto 0; }
.themeCardMini{ border-radius:18px; padding:20px 12px; border:1px solid var(--line); text-align:left; }
.themeCardMini .swatchRow{ display:flex; gap:5px; margin-bottom:10px; }
.themeCardMini .sw{ width:16px; height:16px; border-radius:50%; }
.themeCardMini b{ font-family:'Fraunces',serif; font-size:14.5px; display:block; }
.themeCardMini span{ font-size:11.5px; opacity:0.75; }

footer.siteFooter{ text-align:center; padding:30px 20px 50px; color:var(--ink-soft); font-size:12.5px; }

/* ================= CREATE (tabbed editor) ================= */
#view-create{ min-height:100vh; padding-bottom:110px; }
.editorWrap{ max-width:640px; margin:0 auto; padding:16px 16px 20px; }
.tabBar{ display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; margin-bottom:18px; scrollbar-width:none; }
.tabBar::-webkit-scrollbar{ display:none; }
.tabBtn{ flex-shrink:0; padding:9px 16px; border-radius:20px; font-size:13px; background:var(--panel); border:1px solid var(--line); color:var(--ink-soft); }
.tabBtn.active{ background:var(--plum); color:var(--panel); border-color:var(--plum); }
.tabPanel{ display:none; }
.tabPanel.active{ display:block; }
.panelCard{ background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:18px; margin-bottom:14px; }
.panelCard h3{ font-size:16px; margin-bottom:4px; }
.panelCard .sub{ font-size:12.5px; color:var(--ink-soft); margin-bottom:14px; }
.field label{ font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); display:block; margin:12px 0 6px; }
.field label:first-child{ margin-top:0; }
.field input[type=text], .field textarea{ width:100%; background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:10px 12px; font-family:'Outfit',sans-serif; font-size:13.5px; color:var(--ink); }

/* lock tab */
.pcDots{ display:flex; gap:10px; margin:14px 0; }
.pcDotDisplay{ width:12px; height:12px; border-radius:50%; border:1.5px solid var(--plum); }
.pcDotDisplay.filled{ background:var(--plum); }
.pinInput{ letter-spacing:8px; font-size:20px; text-align:center; font-family:'IBM Plex Mono',monospace; }
.noLockNote{ font-size:12.5px; color:var(--ink-soft); margin-top:10px; }

/* theme tab */
.themeGrid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
.themeCard{ border-radius:18px; padding:16px; text-align:left; border:2px solid var(--line); position:relative; overflow:hidden; }
.themeCard.sel{ border-color:var(--plum); }
.themeCard .swatchRow{ display:flex; gap:5px; margin-bottom:10px; }
.themeCard .sw{ width:16px; height:16px; border-radius:50%; }
.themeCard b{ font-family:'Fraunces',serif; font-size:14.5px; display:block; margin-bottom:2px; }
.themeCard span{ font-size:11px; opacity:0.7; }
.themeCard .check{ position:absolute; top:10px; right:10px; width:18px; height:18px; border-radius:50%; background:var(--plum); color:#fff; font-size:11px; display:none; align-items:center; justify-content:center; }
.themeCard.sel .check{ display:flex; }

/* bouquet tab (composer) */
#bouquetCanvas{ position:relative; width:100%; aspect-ratio:4/5; max-height:460px; background:radial-gradient(ellipse at 50% 105%, rgba(140,90,107,0.14), transparent 60%), var(--panel); border:1px solid var(--line); border-radius:26px; overflow:hidden; box-shadow:var(--shadow); touch-action:none; margin-bottom:12px; }
.vaseGuide{ position:absolute; left:50%; bottom:6%; width:36%; height:26%; transform:translateX(-50%); border:1.5px dashed rgba(76,107,79,0.35); border-radius:0 0 26px 26px; pointer-events:none; }
.canvasEmpty{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:20px; color:var(--ink-soft); font-size:14px; gap:8px; }
.canvasEmpty .bigIcon{ font-size:30px; opacity:0.6; }
.stageFlower{ position:absolute; width:64px; height:64px; margin-left:-32px; margin-top:-32px; display:flex; align-items:center; justify-content:center; touch-action:none; filter:drop-shadow(0 6px 10px rgba(32,48,31,0.18)); animation:popIn .35s var(--ease); }
.stageFlower svg{ width:100%; height:100%; overflow:visible; }
.stageFlower.selected::after{ content:''; position:absolute; inset:-8px; border:1.5px dashed var(--plum); border-radius:50%; animation:spinSlow 12s linear infinite; }
@keyframes spinSlow{ to{ transform:rotate(360deg); } }
@keyframes popIn{ from{ transform:scale(0.4); opacity:0; } to{ transform:scale(1); opacity:1; } }
.toolbar{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:10px 12px; background:var(--panel); border:1px solid var(--line); border-radius:16px; min-height:52px; margin-bottom:14px; }
.toolbar[aria-disabled="true"]{ opacity:0.45; }
.toolbar button{ width:34px; height:34px; border-radius:50%; background:var(--bg-deep); font-size:14px; display:flex; align-items:center; justify-content:center; }
.toolbar .del{ margin-left:auto; color:var(--plum-deep); font-size:12px; width:auto; border-radius:20px; padding:0 12px; background:transparent; border:1px solid var(--line); }
.toolbar .hint{ font-size:11px; color:var(--ink-soft); width:100%; order:99; }
.flowerTypeGrid{ display:grid; grid-template-columns:repeat(6,1fr); gap:6px; margin-bottom:12px; }
.flowerTypeBtn{ background:var(--bg); border:1.5px solid var(--line); border-radius:12px; padding:6px 2px; display:flex; flex-direction:column; align-items:center; }
.flowerTypeBtn svg{ width:24px; height:24px; }
.flowerTypeBtn.sel{ border-color:var(--plum); background:rgba(140,90,107,0.08); }
.colorRow{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
.colorDot{ width:24px; height:24px; border-radius:50%; border:2px solid transparent; }
.colorDot.sel{ border-color:var(--ink); }
.addFlowerBtn{ width:100%; background:var(--leaf); color:var(--panel); padding:10px; border-radius:14px; font-size:13px; }

/* photos tab */
.photoGridEdit{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:12px; }
.photoSlot{ aspect-ratio:1; border-radius:14px; border:1.5px dashed var(--line); display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative; background:var(--bg); font-size:11px; color:var(--ink-soft); text-align:center; }
.photoSlot img{ width:100%; height:100%; object-fit:cover; }
.photoSlot input[type=file]{ position:absolute; inset:0; opacity:0; cursor:pointer; }
.photoSlot .rm{ position:absolute; top:4px; right:4px; width:20px; height:20px; border-radius:50%; background:rgba(0,0,0,0.55); color:#fff; font-size:11px; z-index:2; }
.captionInput{ font-size:11.5px; width:100%; margin-top:4px; border:1px solid var(--line); border-radius:8px; padding:4px 6px; background:var(--bg); }

.charCount{ font-size:10.5px; color:var(--ink-soft); text-align:right; }
.formError{ font-size:12.5px; color:var(--plum-deep); margin-top:8px; min-height:16px; }
.sizeNote{ font-size:11.5px; color:var(--ink-soft); margin-top:6px; }

.stickyActions{ position:fixed; bottom:0; left:0; right:0; z-index:40; background:linear-gradient(0deg,var(--bg) 60%,transparent); padding:16px 16px 18px; display:flex; gap:10px; justify-content:center; }
.stickyActions .btn{ flex:1; max-width:220px; text-align:center; }

/* ================= GIFT VIEW ================= */
#view-gift{ min-height:100vh; }
.themedWrap{ background:linear-gradient(160deg,var(--t-bg),var(--t-bg2)); color:var(--t-ink); min-height:100vh; padding:40px 20px 70px; }
.giftWrap{ max-width:520px; margin:0 auto; }
.stateBox{ text-align:center; padding:70px 20px; }
.spinner{ width:34px; height:34px; border:3px solid rgba(0,0,0,0.12); border-top-color:var(--t-accent); border-radius:50%; margin:0 auto 18px; animation:spin .8s linear infinite; }
@keyframes spin{ to{transform:rotate(360deg);} }
.stateBox h2{ font-size:20px; margin-bottom:8px; color:var(--t-ink); }

/* lock screen (per gift) */
.giftLock{ text-align:center; padding-top:12vh; }
.giftLock .lockIcon{ width:54px; height:54px; margin:0 auto 20px; border-radius:50%; background:var(--t-accent2); display:flex; align-items:center; justify-content:center; font-size:22px; }
.giftLock h2{ font-size:24px; margin-bottom:6px; }
.giftLock p{ font-size:13.5px; opacity:0.75; margin-bottom:26px; }
.pcRow{ display:flex; gap:14px; justify-content:center; margin-bottom:28px; }
.pcRow .d{ width:13px; height:13px; border-radius:50%; border:1.5px solid var(--t-accent); }
.pcRow .d.filled{ background:var(--t-accent); }
.pcRow .d.err{ border-color:#c0392b; }
.keypad2{ display:grid; grid-template-columns:repeat(3,60px); gap:12px; justify-content:center; }
.key2{ width:60px; height:60px; border-radius:50%; background:rgba(255,255,255,0.4); border:1px solid rgba(0,0,0,0.08); color:var(--t-ink); font-size:19px; display:flex; align-items:center; justify-content:center; }
.key2.ghost{ background:transparent; border:none; }
.lockErr{ font-size:12.5px; color:#c0392b; margin-top:14px; min-height:16px; }

/* opener stage */
.openerStage{ position:relative; width:100%; height:60vh; max-height:520px; overflow:hidden; display:flex; align-items:center; justify-content:center; border-radius:0 0 30px 30px; }
.openerStage svg, .openerStage .oShape{ position:relative; }
.skipOpener{ position:absolute; bottom:16px; right:16px; font-size:12px; background:rgba(255,255,255,0.5); padding:8px 14px; border-radius:20px; z-index:5; }

/* bloom opener */
.o-bloom .centerBloom{ width:120px; height:120px; opacity:0; transform:scale(0.2) rotate(-30deg); }
.o-bloom.play .centerBloom{ animation:oBloomIn 1.6s var(--ease) forwards; }
@keyframes oBloomIn{ to{ opacity:1; transform:scale(1) rotate(0deg); } }
.o-bloom .ring{ position:absolute; width:220px; height:220px; border:1px solid var(--t-accent); border-radius:50%; opacity:0; }
.o-bloom.play .ring{ animation:oRing 1.8s var(--ease) forwards; }
@keyframes oRing{ 0%{opacity:0.6;transform:scale(0.4);} 100%{opacity:0;transform:scale(1.6);} }

/* envelope opener */
.o-envelope .env{ width:160px; height:110px; position:relative; }
.o-envelope .envBody{ position:absolute; inset:0; background:var(--t-accent2); border-radius:8px; }
.o-envelope .envFlap{ position:absolute; top:0; left:0; width:100%; height:60%; background:var(--t-accent); clip-path:polygon(0 0,100% 0,50% 100%); transform-origin:top center; transition:transform 1s var(--ease); }
.o-envelope.play .envFlap{ transform:rotateX(180deg); }
.o-envelope .burst{ position:absolute; bottom:100%; left:50%; width:60px; height:60px; margin-left:-30px; opacity:0; }
.o-envelope.play .burst{ animation:oBurst 1.4s var(--ease) .5s forwards; }
@keyframes oBurst{ 0%{opacity:0;transform:translateY(0) scale(0.4);} 60%{opacity:1;} 100%{opacity:1;transform:translateY(-40px) scale(1);} }

/* petals opener */
.o-petals .fallP{ position:absolute; top:-10%; width:16px; height:20px; border-radius:60% 60% 60% 0; background:var(--t-accent); opacity:0; }
.o-petals.play .fallP{ animation:oFall 2.2s var(--ease) forwards; }
@keyframes oFall{ 0%{opacity:0; transform:translateY(0) rotate(0deg);} 15%{opacity:0.9;} 100%{opacity:0.9; transform:translateY(340px) rotate(200deg);} }
.o-petals .centerWord{ opacity:0; font-family:'Fraunces',serif; font-style:italic; font-size:20px; }
.o-petals.play .centerWord{ animation:oFadeIn 1s ease 1.4s forwards; }
@keyframes oFadeIn{ to{opacity:1;} }

/* stars opener */
.o-stars{ background:radial-gradient(ellipse at center,#232a4a,#14172b); }
.o-stars .st{ position:absolute; width:5px; height:5px; border-radius:50%; background:var(--t-accent); opacity:0; box-shadow:0 0 8px var(--t-accent); }
.o-stars.play .st{ animation:oTwinkle 1.8s ease forwards; }
@keyframes oTwinkle{ 0%{opacity:0; transform:scale(0.3);} 50%{opacity:1; transform:scale(1.4);} 100%{opacity:0.9; transform:scale(1);} }
.o-stars .heartLine{ opacity:0; stroke:var(--t-accent2); stroke-width:1.3; fill:none; stroke-dasharray:300; stroke-dashoffset:300; }
.o-stars.play .heartLine{ animation:oDraw 1.6s var(--ease) .5s forwards; }
@keyframes oDraw{ 0%{opacity:0.8; stroke-dashoffset:300;} 100%{opacity:0.9; stroke-dashoffset:0;} }

/* hourglass opener */
.o-glass .hg{ width:70px; height:110px; position:relative; opacity:0; transform:translateY(10px); }
.o-glass.play .hg{ animation:oFadeUp 1s ease forwards; }
@keyframes oFadeUp{ to{opacity:1; transform:translateY(0);} }
.o-glass .grain{ position:absolute; left:50%; top:20%; width:4px; height:4px; border-radius:50%; background:var(--t-accent); opacity:0; }
.o-glass.play .grain{ animation:oGrain 1.6s linear .3s forwards; }
@keyframes oGrain{ 0%{opacity:1; top:20%;} 100%{opacity:0.8; top:78%;} }

/* waves opener */
.o-waves .wv{ position:absolute; left:-10%; width:120%; height:60px; border-radius:50%; background:var(--t-accent2); opacity:0.5; }
.o-waves.play .wv{ animation:oWave 2s var(--ease) forwards; }
@keyframes oWave{ 0%{ transform:translateY(220px) scaleX(0.8);} 100%{ transform:translateY(-40px) scaleX(1.2); opacity:0;} }
.o-waves .centerBloom2{ opacity:0; }
.o-waves.play .centerBloom2{ animation:oFadeIn 1s ease 1.2s forwards; }

.giftMeta{ text-align:center; margin:26px 0 8px; }
.giftMeta .eyebrow{ justify-content:center; display:flex; gap:8px; font-size:10.5px; letter-spacing:0.25em; text-transform:uppercase; color:var(--t-accent); }
.giftTitle{ font-size:clamp(24px,6vw,32px); margin-bottom:14px; text-align:center; }
.giftMessage{ background:rgba(255,255,255,0.5); border:1px solid rgba(0,0,0,0.06); border-radius:20px; padding:26px 22px; font-size:15.5px; line-height:1.8; white-space:pre-wrap; }
.giftSign{ text-align:right; font-family:'Fraunces',serif; font-style:italic; color:var(--t-accent); margin-top:14px; }
.giftFootRow{ display:flex; justify-content:center; gap:14px; margin-top:22px; flex-wrap:wrap; }

.photoGallery{ display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin:28px 0; }
.photoGallery figure{ margin:0; border-radius:16px; overflow:hidden; background:rgba(255,255,255,0.4); }
.photoGallery img{ width:100%; aspect-ratio:1; object-fit:cover; display:block; }
.photoGallery figcaption{ font-size:11.5px; padding:6px 8px; opacity:0.75; }

.shareCard{ margin-top:34px; background:rgba(255,255,255,0.55); border:1px solid rgba(0,0,0,0.06); border-radius:22px; padding:24px; text-align:center; }
.shareCard h3{ font-size:16px; margin-bottom:14px; color:var(--t-ink); }
#qrBox{ background:#fff; display:inline-block; padding:12px; border-radius:14px; }
.shareBtnRow{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:16px; }
.linkPill{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; background:rgba(255,255,255,0.5); border:1px solid rgba(0,0,0,0.06); border-radius:20px; padding:8px 14px; margin-top:14px; word-break:break-all; }
.qrNote{ font-size:12px; opacity:0.7; margin-top:10px; }

#toast{ position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(16px); background:var(--ink); color:var(--panel); padding:11px 20px; border-radius:22px; font-size:13px; opacity:0; transition:all .3s var(--ease); z-index:200; pointer-events:none; }
#toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

#previewModal{ position:fixed; inset:0; background:rgba(20,26,17,0.55); backdrop-filter:blur(4px); z-index:150; display:none; align-items:flex-end; justify-content:center; }
#previewModal.open{ display:flex; }
@media(min-width:700px){ #previewModal{ align-items:center; } }
.previewSheet{ background:var(--t-bg,var(--bg)); width:100%; max-width:560px; max-height:88vh; overflow-y:auto; border-radius:26px 26px 0 0; position:relative; }
@media(min-width:700px){ .previewSheet{ border-radius:26px; } }
.previewSheet .closeX{ position:sticky; top:10px; float:right; margin-right:10px; width:34px; height:34px; border-radius:50%; background:#fff; border:1px solid var(--line); font-size:16px; z-index:6; }

@media(min-width:960px){ .themeGrid{ grid-template-columns:repe
